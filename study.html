<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>专注 B站 · 更新插件</title>
  <link rel="stylesheet" href="src/upgrade/upgrade.css">
</head>
<body>
  <main>
    <h1>插件已改为直接精简 B站网页</h1>
    <p>浏览器仍在使用旧版入口。请先重新加载插件，再打开 B站。</p>
    <ol>
      <li>打开扩展管理，找到「专注 B站」。</li>
      <li>点击该扩展的重新加载按钮。</li>
      <li>重新访问 B站首页，或刷新已有 B站标签页。</li>
    </ol>
    <p>老师收藏和配色会保留，无需卸载插件。</p>
    <div><button id="manage" type="button">打开扩展管理</button><a href="https://www.bilibili.com/">已重新加载，打开 B站</a></div>
    <p id="status" role="status"></p>
  </main>
  <script src="src/upgrade/upgrade.js"></script>
</body>
</html>
